name: Production boot check
on:
  push:
    branches: [fix/vercel-production-boot]
  pull_request:
  workflow_dispatch:
jobs:
  boot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        stale_cache: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, bcmath, gd, intl, zip
      - name: Install like Vercel (no dev packages)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
      - name: Build the assets (Vercel does not run npm for this PHP project)
        run: npm ci --no-audit --no-fund && npm run build
      - name: Simulate a package cache left over from a developer machine
        if: matrix.stale_cache
        run: |
          cp composer.json /tmp/composer.json.bak; cp composer.lock /tmp/composer.lock.bak
          composer require --dev laravel/pail:^1.2.2 --no-interaction --no-progress -W >/dev/null 2>&1
          php artisan package:discover >/dev/null 2>&1
          cp bootstrap/cache/packages.php /tmp/stale-packages.php; cp bootstrap/cache/services.php /tmp/stale-services.php
          cp /tmp/composer.json.bak composer.json; cp /tmp/composer.lock.bak composer.lock
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          cp /tmp/stale-packages.php bootstrap/cache/packages.php; cp /tmp/stale-services.php bootstrap/cache/services.php
          echo "stale files mention Pail: $(grep -c Pail bootstrap/cache/packages.php)"
      - name: Apply what .vercelignore keeps out of the upload
        run: |
          grep -E '^bootstrap/cache' .vercelignore || { echo "::error::.vercelignore does not exclude bootstrap/cache/*.php"; exit 1; }
          for pattern in $(grep -E '^bootstrap/cache' .vercelignore); do rm -f $pattern; done
          ls bootstrap/cache
      - name: Production-like environment (placeholder values only)
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=production"; echo "APP_DEBUG=true"
            echo "DB_CONNECTION=sqlite"; echo "DB_DATABASE=$PWD/database/database.sqlite"
            echo "SESSION_DRIVER=cookie"; echo "CACHE_STORE=file"; echo "QUEUE_CONNECTION=sync"
            echo "LOG_CHANNEL=stderr"; echo "FILESYSTEM_DISK=public"
          } >> .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --seed --force >/dev/null
      - name: Boot with Vercel's environment and request the pages
        run: |
          export VERCEL=1 APP_CONFIG_CACHE=/tmp/config.php APP_EVENTS_CACHE=/tmp/events.php APP_PACKAGES_CACHE=/tmp/packages.php APP_ROUTES_CACHE=/tmp/routes.php APP_SERVICES_CACHE=/tmp/services.php VIEW_COMPILED_PATH=/tmp/storage/framework/views
          rm -f /tmp/packages.php /tmp/services.php
          php -S 127.0.0.1:8000 -t public public/index.php > /tmp/serve.log 2>&1 &
          sleep 3
          fail=0
          for p in / /products /products/1 /categories /login /register /api/products; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000$p); echo "GET $p -> $code"
            [ "$code" = 200 ] || fail=1
          done
          [ $fail = 0 ] || { echo "--- server log"; tail -n 30 /tmp/serve.log; exit 1; }

  bundle:
    name: boot on the PHP bundle Vercel will run, with Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: luxwatch }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, bcmath, gd, intl, zip
      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Remove what .vercelignore keeps out of the upload
        run: for pattern in $(grep -E '^bootstrap/cache' .vercelignore); do rm -f $pattern; done
      - name: Environment (placeholder values only)
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=production"; echo "APP_DEBUG=true"
            echo "DB_CONNECTION=pgsql"; echo "DB_HOST=127.0.0.1"; echo "DB_PORT=5432"; echo "DB_DATABASE=luxwatch"; echo "DB_USERNAME=postgres"; echo "DB_PASSWORD=ci"
            echo "SESSION_DRIVER=cookie"; echo "CACHE_STORE=file"; echo "QUEUE_CONNECTION=sync"; echo "LOG_CHANNEL=stderr"; echo "FILESYSTEM_DISK=public"
          } >> .env
          php artisan key:generate --force
          php artisan migrate --seed --force >/dev/null
      - name: Fetch the PHP bundle that vercel.json selects
        run: |
          RUNTIME=$(grep -o 'vercel-php@[0-9.]*' vercel.json | head -1); echo "runtime: $RUNTIME"
          VER=$(npm view "$RUNTIME" dependencies --json | python3 -c "import sys,json;print(list(json.load(sys.stdin))[0])"); echo "bundle package: $VER"
          mkdir -p /tmp/bundle && cd /tmp/bundle && npm pack "$VER@latest" >/dev/null 2>&1 && tar xzf *.tgz
          case "$VER" in *almalinux-9*) IMG=almalinux:9;; *) IMG=amazonlinux:2;; esac
          echo "IMG=$IMG" >> $GITHUB_ENV; docker pull -q $IMG >/dev/null
          docker run --rm -v /tmp/bundle/package:/p $IMG sh -c 'export LD_LIBRARY_PATH=$(find /p -type d -name lib | tr "\n" ":"); /p/native/php/php -r "echo PHP_VERSION, \" \", implode(\",\", get_loaded_extensions()), PHP_EOL;" 2>/dev/null' | tee /tmp/bundle.txt
          echo "BUNDLE_PHP=$(cut -d' ' -f1 /tmp/bundle.txt)" >> $GITHUB_ENV
      - name: Serve the app with that PHP and request the pages
        run: |
          docker run -d --name app --network host -v $PWD:/app -v /tmp/bundle/package:/p \
            -e VERCEL=1 -e APP_CONFIG_CACHE=/tmp/config.php -e APP_EVENTS_CACHE=/tmp/events.php -e APP_PACKAGES_CACHE=/tmp/packages.php -e APP_ROUTES_CACHE=/tmp/routes.php -e APP_SERVICES_CACHE=/tmp/services.php -e VIEW_COMPILED_PATH=/tmp/storage/framework/views \
            $IMG sh -c 'export LD_LIBRARY_PATH=$(find /p -type d -name lib | tr "\n" ":"); cd /app && /p/native/php/php -S 127.0.0.1:8000 -t public public/index.php'
          sleep 5
          fail=0
          for p in / /products /products/1 /categories /login /register /api/products /up; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000$p); echo "GET $p -> $code"; [ "$code" = 200 ] || fail=1
          done
          [ $fail = 0 ] || { docker logs app 2>&1 | tail -30; exit 1; }
      - name: Fail if the bundle is older than the October 2026 security releases
        run: |
          echo "bundle PHP: $BUNDLE_PHP"
          python3 - <<'PY'
          import os,sys
          v=tuple(int(x) for x in os.environ["BUNDLE_PHP"].split("-")[0].split(".")[:3])
          fixed={(8,5):12,(8,4):27,(8,3):36,(8,2):35}
          need=fixed.get(v[:2])
          if need is None or v[2]<need:
              print(f"::error::PHP {'.'.join(map(str,v))} is older than the fixed releases for CVE-2026-109618 and CVE-2026-109619 (8.5.12, 8.4.27, 8.3.36, 8.2.35)"); sys.exit(1)
          print("OK: at or past the fixed release")
          PY

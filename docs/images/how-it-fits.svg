<title id="t">How the pieces fit together</title><desc id="d">A browser uses the Blade and Livewire storefront. The Flutter app uses the REST API with a Sanctum token. Both run inside one Laravel 12 app that reads and writes MySQL and talks to Stripe. The API asks Firebase to check Google sign-in tokens.</desc><defs>

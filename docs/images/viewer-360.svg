<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a5c28"/></marker>
<style>.b{fill:#fff;stroke:#d9d4c7;stroke-width:1.5}.t{font-size:15px;fill:#121315;font-weight:600}.s{font-size:12px;fill:#66625a}.n{font-size:11px;fill:#7a5c28;font-weight:600}.l{stroke:#7a5c28;stroke-width:1.6;fill:none}</style></defs>
<rect width="1000" height="330" fill="#f5f3ef"/>
<text x="500" y="34" text-anchor="middle" class="t" font-size="18">How a watch turns on your screen</text>
<g>
<rect class="b" x="30" y="70" width="52" height="64" rx="3"/><rect class="b" x="92" y="70" width="52" height="64" rx="3"/><rect class="b" x="154" y="70" width="52" height="64" rx="3"/><rect class="b" x="216" y="70" width="52" height="64" rx="3"/>
<text x="56" y="108" text-anchor="middle" class="s">1</text><text x="118" y="108" text-anchor="middle" class="s">2</text><text x="180" y="108" text-anchor="middle" class="s">3</text><text x="242" y="108" text-anchor="middle" class="s">...</text>
</g>
<text x="150" y="162" text-anchor="middle" class="t">60 to 130 photos</text><text x="150" y="182" text-anchor="middle" class="s">of one watch, one full turn</text>
<path class="l" d="M290 102 H350" marker-end="url(#a)"/><text x="320" y="94" text-anchor="middle" class="n">1</text>
<rect class="b" x="350" y="60" width="220" height="86" rx="4"/><text x="460" y="92" text-anchor="middle" class="t">products.spin_frames</text><text x="460" y="114" text-anchor="middle" class="s">a list of image links</text><text x="460" y="132" text-anchor="middle" class="s">saved with the watch</text>
<path class="l" d="M570 102 H630" marker-end="url(#a)"/><text x="600" y="94" text-anchor="middle" class="n">2</text>
<rect class="b" x="630" y="60" width="340" height="86" rx="4"/><text x="800" y="92" text-anchor="middle" class="t">spin360.js in the page</text><text x="800" y="114" text-anchor="middle" class="s">loads frame 1 first, the rest when idle,</text><text x="800" y="132" text-anchor="middle" class="s">and only once the viewer is on screen</text>
<rect class="b" x="30" y="214" width="300" height="86" rx="4"/><text x="180" y="246" text-anchor="middle" class="t">You drag left or right</text><text x="180" y="268" text-anchor="middle" class="s">momentum, arrow keys, auto spin,</text><text x="180" y="286" text-anchor="middle" class="s">Front / Angle / Side / Case back</text>
<path class="l" d="M330 257 H400" marker-end="url(#a)"/><text x="365" y="248" text-anchor="middle" class="n">3</text>
<rect class="b" x="400" y="214" width="260" height="86" rx="4"/><text x="530" y="246" text-anchor="middle" class="t">Distance becomes a frame</text><text x="530" y="268" text-anchor="middle" class="s">a full drag across the picture</text><text x="530" y="286" text-anchor="middle" class="s">is about one turn of the watch</text>
<path class="l" d="M660 257 H730" marker-end="url(#a)"/><text x="695" y="248" text-anchor="middle" class="n">4</text>
<rect class="b" x="730" y="214" width="240" height="86" rx="4"/><text x="850" y="246" text-anchor="middle" class="t">The picture swaps</text><text x="850" y="268" text-anchor="middle" class="s">no 3D engine, no model file,</text><text x="850" y="286" text-anchor="middle" class="s">just the right photo at the right time</text>
</svg>
